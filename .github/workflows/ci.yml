name: CI (PR build + test)

# Run on every pull request and on pushes to non-main branches so we catch
# regressions before merging.
on:
    pull_request:
        branches: [main]
    push:
        branches-ignore: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint --if-present

            - name: Tests
              run: npm test --if-present

            - name: Build
              run: npm run build
