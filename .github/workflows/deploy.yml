name: Build & Deploy to GitHub Pages

# Trigger on every push to main, plus a manual button in the Actions tab.
on:
    push:
        branches: [main]
    workflow_dispatch: {}

# Permissions required by actions/deploy-pages.
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, and let in-flight runs finish.
concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm test --if-present

            - name: Build production bundle (GitHub Pages sub-path)
              run: npm run build -- --base=/Ped-pearls/

            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
